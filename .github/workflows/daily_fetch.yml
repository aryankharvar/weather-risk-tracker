name: Daily Weather Risk Fetch

on:
  schedule:
    # Once daily, 12:00 UTC (~7-8am ET) — early enough to inform same-day logistics decisions.
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        run: python fetch_weather.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_risk.db
          git diff --quiet --cached || git commit -m "Daily weather update: $(date -u +'%Y-%m-%d')"
          git push
